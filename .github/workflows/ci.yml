name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Prose-only pull requests skip the Rust jobs. A job that `if:` skips reports success.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!*.md'
              - '!docs/**'

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # One source of truth for the toolchain: read the pin from the file.
      - id: toolchain
        run: sed -n 's/^channel = "\(.*\)"$/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: just@1.59.0
      - run: just format --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: sed -n 's/^channel = "\(.*\)"$/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: just@1.59.0
      - run: just lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: sed -n 's/^channel = "\(.*\)"$/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # nextest does not run doctests, so both.
      - run: just test
      - run: just doctest

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: just@1.59.0,cargo-deny@0.20.2
      - run: just check-deps

  toml-fmt:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: just@1.59.0,taplo@0.10.0
      - run: just format-toml --check

  # The one check the branch ruleset requires.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, fmt, clippy, test, deny, toml-fmt]
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
