name: Oracle (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: sed -n 's/^channel = "\(.*\)"$/channel=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148,uv@0.13.1
      # Regenerate into a temporary directory and compare with tolerances, not bytes:
      # the fuzz test runs the generator and compares the live oracle with burnscars.
      - run: just fuzz-oracle
