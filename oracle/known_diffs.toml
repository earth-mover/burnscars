# Approx: a cell centre exactly on an edge (to 4e-14 of a cell). GDAL rounds the intercepts to
# integer pixels (floor(x + 0.5)), so it takes the centre on a right edge and fills a bottom
# horizontal edge on the centre line. burnscars is left-inclusive (x <= x_mid) and half-open in y.

[[diff]]
table = "approx"
case = "offset_rect"
reason = "Cell centre exactly on an edge: the rectangle edges go through cell centres: x = 2.5, x = 6.5 and the bottom edge y = 4.5. GDAL rounds intercepts to integer pixels and fills bottom horizontal edges, so it takes the right-hand centre; burnscars takes the left (x <= x_mid, spec: Approx path; spec: Oracle). Every differing cell is such a tie."

[[diff]]
table = "approx"
case = "straddle"
reason = "Cell centre exactly on an edge: the right edge x = 4.5 and the bottom edge y = 2.5 go through cell centres. GDAL rounds intercepts to integer pixels and fills bottom horizontal edges, so it takes the right-hand centre; burnscars takes the left (x <= x_mid, spec: Approx path; spec: Oracle). Every differing cell is such a tie."

[[diff]]
table = "approx"
case = "grid_node"
reason = "Cell centre exactly on an edge: both slanted edges go through cell centres (x = y and x + y = 10). GDAL rounds intercepts to integer pixels and fills bottom horizontal edges, so it takes the right-hand centre; burnscars takes the left (x <= x_mid, spec: Approx path; spec: Oracle). Every differing cell is such a tie."

